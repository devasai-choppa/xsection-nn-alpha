[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xsection-nn-alpha"
version = "1.0.0"
description = "Neural-network cross-sectional equity ranking with walk-forward backtests"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Devasai Choppa" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "torch>=2.2",
    "yfinance>=0.2.40",
    "pandas-datareader>=0.10",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "statsmodels>=0.14",
    "scipy>=1.12",
    "lxml>=5",
    "html5lib>=1.1",
]

[project.optional-dependencies]
viz = [
    "manim>=0.18.1",
    "plotly>=5.22",
    "streamlit>=1.36",
    "pyvis>=0.3.2",
    "captum>=0.7.0",
    "playwright>=1.45",
    "edge-tts>=6.1.12",
    "moviepy>=1.0.3",
    "imageio>=2.34",
    "pillow>=10.3",
]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["xsnn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
